<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gestione Prodotti — Khalil Fedeltà</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body{padding:0;}
  .admin-wrap{max-width:900px;margin:0 auto;padding:40px 5% 100px;}
  .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;flex-wrap:wrap;gap:14px;}
  .admin-header h1{font-size:1.6rem;font-weight:800;}
  .logout-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s;}
  .logout-btn:hover{border-color:#f87171;color:#f87171;}

  #loginScreen{max-width:380px;margin:80px auto;text-align:center;}
  #loginScreen h2{font-size:1.4rem;margin-bottom:8px;}
  #loginScreen p{color:var(--muted);font-size:.9rem;margin-bottom:26px;}
  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green);}
  .field textarea{resize:vertical;min-height:70px;}
  .primary-btn{
    width:100%;background:var(--green);border:none;color:var(--bg);
    padding:13px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.2s;
  }
  .primary-btn:hover{background:var(--green-dark);}
  .error-msg{color:#f87171;font-size:.85rem;margin-top:10px;min-height:18px;}

  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:36px;}
  .form-card h2{font-size:1.15rem;margin-bottom:20px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-grid .full{grid-column:1/-1;}
  .image-preview{
    width:100%;height:140px;border-radius:8px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
    font-size:.85rem;overflow:hidden;margin-bottom:10px;border:1px dashed var(--line);
  }
  .image-preview img{width:100%;height:100%;object-fit:cover;}

  .gallery-preview{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;
  }
  .gallery-thumb{
    position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface2);
  }
  .gallery-thumb img{width:100%;height:100%;object-fit:cover;}
  .gallery-thumb .remove-thumb{
    position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,.7);color:#fff;border:none;cursor:pointer;font-size:.8rem;
    display:flex;align-items:center;justify-content:center;
  }
  .gallery-thumb .remove-thumb:hover{background:#f87171;}
  .gallery-empty{color:var(--muted);font-size:.85rem;padding:10px 0;}

  .checkbox-label{
    display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--text);cursor:pointer;
  }
  .checkbox-label input{width:auto;accent-color:var(--green);}

  .list-title{font-size:1.15rem;font-weight:700;margin-bottom:16px;}
  .admin-list{display:flex;flex-direction:column;gap:12px;}
  .admin-row{
    display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:12px 16px;
  }
  .admin-row .thumb{
    width:52px;height:52px;border-radius:8px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex-shrink:0;
  }
  .admin-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .admin-row .info{flex:1;min-width:0;}
  .admin-row .info h4{font-size:.95rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .admin-row .info span{color:var(--muted);font-size:.8rem;}
  .row-actions{display:flex;gap:8px;flex-shrink:0;}
  .row-actions button{
    background:var(--surface2);border:1px solid var(--line);color:var(--text);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s;
  }
  .row-actions .edit-btn:hover{border-color:var(--green);color:var(--green);}
  .row-actions .delete-btn:hover{border-color:#f87171;color:#f87171;}

  .status-msg{padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:.85rem;display:none;}
  .status-msg.show{display:block;}
  .status-msg.success{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3);}
  .status-msg.error{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.3);}

  @media(max-width:600px){ .form-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="logo" style="justify-content:center;margin-bottom:20px;">
    <span class="logo-badge">K</span>
    <div>Khalil<span class="fedelta">Fedeltà</span></div>
  </div>
  <h2>Accesso Gestione Prodotti</h2>
  <p>Inserisci le tue credenziali per aggiungere o modificare i prodotti.</p>
  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="es. negozio@khalilfedelta.it">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
  </div>
  <button class="primary-btn ripple-btn" id="loginBtn">Accedi</button>
  <div class="error-msg" id="loginError"></div>
</div>

<div class="admin-wrap" id="adminPanel" style="display:none;">
  <div class="admin-header">
    <div class="logo">
      <span class="logo-badge">K</span>
      <div>Gestione <span class="fedelta">Prodotti</span></div>
    </div>
    <button class="logout-btn" id="logoutBtn">Esci</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="form-card">
    <h2 id="formTitle">Aggiungi Nuovo Prodotto</h2>
    <input type="hidden" id="editId" value="">
    <div class="form-grid">
      <div class="field full">
        <label>Nome Prodotto</label>
        <input type="text" id="fName" placeholder="es. Detersivo Multiuso">
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="fCat">
          <option value="macchine">🛠️ Macchine di Pulizia</option>
          <option value="attrezzi">🧹 Attrezzi di Pulizia</option>
          <option value="liquidi">🧴 Prodotti Liquidi</option>
        </select>
      </div>
      <div class="field">
        <label>Badge (opzionale)</label>
        <select id="fBadge">
          <option value="">Nessuno</option>
          <option value="offerta">🟡 Offerta</option>
          <option value="bestseller">🟢 Più Venduto</option>
        </select>
      </div>
      <div class="field">
        <label>Prezzo attuale (€)</label>
        <input type="number" id="fPrice" placeholder="es. 25" step="0.01">
      </div>
      <div class="field">
        <label>Prezzo prima dell'offerta (opzionale)</label>
        <input type="number" id="fOldPrice" placeholder="lascia vuoto se nessuna offerta" step="0.01">
      </div>
      <div class="field full">
        <label>Descrizione breve</label>
        <textarea id="fDesc" placeholder="Descrizione breve del prodotto..."></textarea>
      </div>
      <div class="field full">
        <label>Emoji (usata solo se non carichi foto)</label>
        <input type="text" id="fIcon" placeholder="es. 🧴" maxlength="4">
      </div>
      <div class="field full">
        <label>Foto del prodotto (fino a 4 immagini, prese dal tuo computer)</label>
        <div class="gallery-preview" id="galleryPreview"></div>
        <input type="file" id="fImages" accept="image/*" multiple>
      </div>
      <div class="field full">
        <label class="checkbox-label">
          <input type="checkbox" id="fOutOfStock">
          Prodotto esaurito (non disponibile per l'acquisto)
        </label>
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:12px;">
      <button class="primary-btn ripple-btn" id="saveBtn" style="flex:1;">Salva Prodotto</button>
      <button class="logout-btn" id="cancelEditBtn" style="display:none;">Annulla</button>
    </div>
  </div>

  <div class="list-title">Prodotti Attuali</div>
  <div class="admin-list" id="adminList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
